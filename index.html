<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲劇本生成與掃描器 V14 (圖形化組合版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; margin: 0; }
        h1 { color: #569cd6; text-align: center; margin-top: 0;}
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1600px; margin: 0 auto; height: 90vh;}
        .panel { background-color: #252526; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex: 1; min-width: 500px; display: flex; flex-direction: column; overflow: hidden;}
        .scroll-area { overflow-y: auto; padding-right: 10px; flex: 1; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #9cdcfe; font-weight: bold; }
        .hint-text { font-size: 0.8rem; color: #888; font-weight: normal; margin-left: 8px; }
        input[type="text"], textarea, select, input[type="number"] { width: 100%; padding: 8px; background-color: #3c3c3c; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: none; overflow: hidden; min-height: 42px; line-height: 1.5; font-family: inherit;}
        .option-block { border: 1px solid #444; padding: 15px; margin-bottom: 15px; border-radius: 6px; background-color: #2d2d2d; position: relative; border-left: 4px solid #c586c0; transition: 0.3s; }
        .option-block h3 { margin-top: 0; color: #ce9178; font-size: 16px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background-color: #007acc; color: white; width: 100%; margin-bottom: 20px; }
        .btn-add:hover { background-color: #005f9e; }
        .btn-remove { background-color: #f44336; color: white; position: absolute; right: 10px; top: 10px; padding: 5px 10px; }
        .btn-generate { background-color: #4caf50; color: white; width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; }
        .btn-stash { background-color: #d7ba7d; color: #1e1e1e; width: 100%; padding: 10px; margin-top: 10px; }
        .btn-export { background-color: #c586c0; color: white; width: 100%; padding: 10px; margin-top: 10px; }
        .btn-clear { background-color: #f44336; color: white; margin-top: 10px; width: 100%; }
        .btn-parse { background-color: #569cd6; color: white; width: 100%; padding: 12px; margin-bottom: 15px; font-size: 15px; }
        pre { background-color: #1e1e1e; padding: 15px; border-radius: 4px; overflow-x: auto; color: #d4d4d4; font-family: Consolas, monospace; border: 1px solid #555; white-space: pre-wrap; flex: 1; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        .hub-only { display: none; background-color: #2b3a42; padding: 15px; border-radius: 4px; margin-bottom: 15px; border-left: 4px solid #4ec9b0;}
        .lang-input { margin-bottom: 5px; }
        .tabs { display: flex; border-bottom: 2px solid #444; margin-bottom: 15px; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 10px 20px; font-size: 16px; cursor: pointer; font-weight: bold; outline: none; }
        .tab-btn.active { color: #569cd6; border-bottom: 3px solid #569cd6; }
        .tab-content { display: none; height: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }
        .scan-item { background: #2d2d2d; border-left: 4px solid #4ec9b0; padding: 12px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: flex-start; transition: all 0.5s ease; }
        .scan-item.error { border-left-color: #f44336; }
        .scan-item.warning { border-left-color: #d7ba7d; }
        .scan-item.highlighted { border-left-color: #ffeb3b; background-color: #3b3b22; box-shadow: 0 0 12px rgba(255, 235, 59, 0.4); }
        .scan-details { flex: 1; }
        .scan-id { font-weight: bold; color: #ce9178; font-size: 1.1em; margin-bottom: 4px; }
        .err-msg { color: #f44336; font-size: 0.9em; margin: 4px 0;}
        .warn-msg { color: #d7ba7d; font-size: 0.9em; margin: 4px 0;}
        .logic-msg { color: #c586c0; font-size: 0.9em; margin: 4px 0; font-weight: bold;}
        .fix-badge { background-color: #ff9800; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
        .btn-edit { background: #569cd6; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        .opt-list { margin-top: 8px; border-top: 1px solid #444; padding-top: 8px; }
        .builder-row { display: flex; gap: 5px; margin-bottom: 6px; align-items: center; background: #333; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🎮 劇本節點生成器 V14 (圖形化組合版)</h1>

    <div class="container">
        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('editor')">✏️ 節點編輯器</button>
                <button class="tab-btn" id="tabBtnScanner" onclick="switchTab('scanner')">🔍 劇本除錯掃描區</button>
            </div>

            <div id="tab-editor" class="tab-content active scroll-area">
			<div style="background:#1e2d36; padding:15px; margin-bottom:20px; border-radius:4px; border-left: 4px solid #4ec9b0;">
                    <label style="color:#4ec9b0; font-size:16px;">📝 快速草稿反推填入 (支援數值與檢定)</label>
                    <textarea id="draftInput" placeholder="請依照此格式輸入 (前綴支援全/半形冒號)：

主線：你在桌上發現了一把鑰匙。
節點條件：in_room
節點變數：sanity -5

選項：強行打開寶箱
檢定：STR 6
變數：hp -10, gold +50
成功：你把寶箱砸開了，裡面裝滿金幣。
失敗：你的手被夾到，受了點傷。

選項：用鑰匙打開
條件：has_key
移除標籤：has_key
跳轉：next_room_01" style="min-height: 200px; margin-bottom:10px; font-family: monospace;"></textarea>
                    <button class="btn" style="background:#4ec9b0; color:#1e1e1e; width:100%; font-size: 16px;" onclick="parseDraftToUI()">⬇️ 自動解析並填入下方表單</button>
                </div>
                <div class="row form-group">
                    <div class="col">
                        <label>劇本模式</label>
                        <select id="scriptMode">
                            <option value="random">🎲 隨機劇本 (DB.templates.push)</option>
                            <option value="fixed">📌 固定劇本 (register)</option>
                        </select>
                    </div>
                </div>

                <div class="row form-group">
                    <div class="col"><label>節點 ID</label><input type="text" id="nodeId"></div>
                    <div class="col">
                        <label>節點架構</label>
                        <select id="nodeType" onchange="toggleHubMode()">
                            <option value="linear">▶️ 線性推進</option>
                            <option value="hub">🔄 箱庭 HUB (支援返回與短描述)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>需求標籤 ReqTags <span class="hint-text">(限隨機劇本)</span></label>
                    <input type="text" id="reqTags" placeholder="例如: has_key, event_triggered">
                </div>

                <div class="form-group">
                    <label>📖 主線對話 (dialogue) <span class="hint-text">💡 建議每行不超過 45 字</span></label>
                    <textarea id="mainZh" class="lang-input" placeholder="中文劇情 (換行代表不同對話框)..." oninput="autoResize(this)"></textarea>
                    <textarea id="mainJp" class="lang-input" placeholder="日文劇情 (選填)" oninput="autoResize(this)"></textarea>
                    <textarea id="mainKr" class="lang-input" placeholder="韓文劇情 (選填)" oninput="autoResize(this)"></textarea>
                </div>

                <div id="hubFields" class="hub-only">
                    <label>🏷️ 箱庭短描述 (briefDialogue) <span class="hint-text">💡 玩家第二次返回此 HUB 時顯示的精簡文字</span></label>
                    <textarea id="briefZh" class="lang-input" placeholder="中文短描述..." oninput="autoResize(this)"></textarea>
                    <textarea id="briefJp" class="lang-input" placeholder="日文短描述" oninput="autoResize(this)"></textarea>
                    <textarea id="briefKr" class="lang-input" placeholder="韓文短描述" oninput="autoResize(this)"></textarea>
                </div>
				<div class="form-group" style="background-color: #2b2b2b; padding: 15px; border-radius: 4px; border-left: 4px solid #d7ba7d; margin-top: 15px;">
                    <label style="color:#d7ba7d; margin-bottom: 10px;">🎁 主節點進入/首次進入獎勵 (onEnter / onFirstEnter)</label>
                    
                    <div class="row" style="margin-bottom: 10px;">
                        <div class="col">
                            <label style="font-size: 0.85em; color: #aaa;">給予標籤 (Tags)</label>
                            <input type="text" id="mainTags" placeholder="逗號分隔 (例: has_key, meet_npc)">
                        </div>
                    </div>

                    <label style="font-size: 0.85em; color: #aaa;">狀態增減 (VarOps) <span class="hint-text">可使用組合器，或在下方直接手寫</span></label>
                    <div class="builder-row">
                        <select class="varop-key" style="flex: 2;">
                            <optgroup class="dynamic-chars" label="當前出場角色 (自動抓取)"></optgroup>
                            
                            <optgroup label="❤️ 情感軸 (aff_)">
                                <option value="aff_main">主要對象 (aff_main)</option>
                                <option value="aff_partner">同伴/搭檔 (aff_partner)</option>
                                <option value="aff_guide_npc">引導/NPC (aff_guide_npc)</option>
                                <option value="aff_threat">明確威脅 (aff_threat)</option>
                            </optgroup>
                            <optgroup label="🤝 信任軸 (trust_)">
                                <option value="trust_main">主要對象 (trust_main)</option>
                                <option value="trust_partner">同伴/搭檔 (trust_partner)</option>
                                <option value="trust_guide_npc">引導/NPC (trust_guide_npc)</option>
                                <option value="trust_threat">明確威脅 (trust_threat)</option>
                            </optgroup>
                            <optgroup label="👁️ 警戒軸 (susp_)">
                                <option value="susp_main">主要對象 (susp_main)</option>
                                <option value="susp_partner">同伴/搭檔 (susp_partner)</option>
                                <option value="susp_guide_npc">引導/NPC (susp_guide_npc)</option>
                                <option value="susp_threat">明確威脅 (susp_threat)</option>
                            </optgroup>
                            <optgroup label="📦 基礎資源">
                                <option value="hp">生命值 (hp)</option>
                                <option value="energy">精力 (energy)</option>
                                <option value="gold">金幣 (gold)</option>
                                <option value="exp">經驗值 (exp)</option>
                                <option value="skill_points">技能點 (skill_points)</option>
                            </optgroup>
                            <optgroup label="⏳ 時間與進度">
                                <option value="time_left">剩餘時間 (time_left)</option>
                                <option value="progress">進度 (progress)</option>
                            </optgroup>
                            <optgroup label="⚠️ 精神與局勢威脅">
                                <option value="sanity">理智值 (sanity)</option>
                                <option value="stress">心理壓力 (stress)</option>
                                <option value="tension">局勢緊張度 (tension)</option>
                                <option value="curse_val">作祟值 (curse_val)</option>
                                <option value="alert_level">警報等級 (alert_level)</option>
                            </optgroup>
                            <optgroup label="🏅 社會與解謎">
                                <option value="prestige">聲望值 (prestige)</option>
                                <option value="credibility">公信度 (credibility)</option>
                                <option value="rank_points">排名分 (rank_points)</option>
                                <option value="evidence_count">線索數 (evidence_count)</option>
                                <option value="puzzle_count">謎題數 (puzzle_count)</option>
                                <option value="knowledge">知識 (knowledge)</option>
                            </optgroup>
                        </select>
                        <select class="varop-op" style="flex: 0.5;"><option value="+">+</option><option value="-">-</option><option value="=">=</option></select>
                        <input type="number" class="varop-val" placeholder="數值" style="flex: 1;">
                        <button type="button" class="btn" style="background:#569cd6; color:white; padding:8px 12px;" onclick="appendVarOp(this)">+ 加入</button>
                    </div>
                    <input type="text" id="mainVarOps" placeholder="最終結果 (例: hp -10, gold +50)">
                </div>
                <hr style="border-color: #555; margin: 20px 0;">
                <label style="font-size: 18px; color: #4ec9b0;">🎯 玩家選項 (Options)</label>
                
                <div id="optionsContainer"></div>
                
                <div class="row" style="margin-bottom: 20px;">
                    <div class="col"><button class="btn btn-add" style="margin-bottom: 0;" onclick="addOption()">+ 手動新增選項</button></div>
                    <div class="col"><button class="btn" style="background-color: #c586c0; color: white; width: 100%;" onclick="pasteOption()">📥 貼上選項 (從掃描區複製)</button></div>
                </div>
                
                <button class="btn btn-generate" onclick="generateAndSync()">⚙️ 生成腳本代碼 (並自動跳轉回掃描區)</button>
                <button class="btn btn-stash" onclick="addToStash()">📥 加入右側備份暫存區</button>
            </div>

            <div id="tab-scanner" class="tab-content scroll-area">
                <p style="color:#aaa; font-size:14px; margin-top:0;">將 JS 代碼貼在下方。系統會深度檢查邏輯死鎖，並<strong style="color:#ff9800;">自動幫你修復層級放錯的 rewards 與 onEnter</strong>。</p>
                <textarea id="scanInput" placeholder="貼上你的 register({...}); 或是 DB.templates.push({...});" style="min-height: 250px; font-family: monospace;" oninput="autoResize(this)"></textarea>
                <button class="btn btn-parse" onclick="runLinter()">🔎 執行深度邏輯掃描與自動修復</button>
                <hr style="border-color: #555;">
                <div id="scanResults">
                    <p style="color:#777; text-align:center; padding: 20px;">掃描結果將顯示於此</p>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="scroll-area" style="display:flex; flex-direction:column; height:100%;">
                <label>📝 單筆生成預覽</label>
                <pre id="outputCode" style="flex: 0.4; min-height:200px;">// 這裡會顯示剛剛生成的單一節點代碼...</pre>
                
                <label style="color:#d7ba7d; margin-top:10px;">📦 劇本暫存區 (可匯出備份)</label>
                <pre id="stashCode" style="flex: 1; background-color: #0d1117;">// 點擊「加入右側備份暫存區」會累積在這裡...</pre>
            </div>
            <div class="row" style="margin-bottom: 10px;">
                    <div class="col"><button class="btn btn-clear" onclick="clearStash()">🗑️ 清空暫存</button></div>
                    <div class="col"><button class="btn btn-export" onclick="downloadJS()">💾 匯出備份 (.js)</button></div>
                </div>
                <div class="row">
                    <div class="col"><button class="btn" style="background:#007acc; color:white; width:100%;" onclick="exportStoryText('zh')">📄 匯出純文本 (僅中文)</button></div>
                    <div class="col"><button class="btn" style="background:#569cd6; color:white; width:100%;" onclick="exportStoryText('all')">🌐 匯出純文本 (多語系)</button></div>
                </div>
        </div>
    </div>

    <script>
        let parsedNodesDB = {}; 
        let optionCount = 0;
        let stashContent = localStorage.getItem('story_generator_stash') || "";
        let currentEditingNodeId = null; 
        let clipboardOption = null; 

        document.getElementById('stashCode').textContent = stashContent ? stashContent : "// 暫存的劇本會累積在這裡...";

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function autoResize(el) {
            if(!el) return;
            el.style.height = 'auto';
            if(el.scrollHeight > 42) { 
                el.style.height = (el.scrollHeight) + 'px';
            }
        }
        function triggerAllResize() {
            setTimeout(() => {
                document.querySelectorAll('textarea').forEach(el => autoResize(el));
            }, 10);
        }

        function toggleHubMode() {
            const isHub = document.getElementById('nodeType').value === 'hub';
            document.getElementById('hubFields').style.display = isHub ? 'block' : 'none';
        }

        function copyOptionToClipboard(optKey) {
            clipboardOption = JSON.parse(JSON.stringify(window[optKey]));
            alert(`✅ 已複製選項：「${clipboardOption.label?.zh || clipboardOption.label}」\n請切換至【節點編輯器】點擊『📥 貼上選項』。`);
        }

        function pasteOption() {
            if (!clipboardOption) return alert("❌ 剪貼簿為空！請先在掃描區點擊『📋 複製選項』");
            addOption(clipboardOption);
        }

        // 🌟 新增：將 Builder 選好的變數加入到文字框
        function appendVarOp(btn) {
            const parent = btn.closest('.form-group');
            const key = parent.querySelector('.varop-key').value;
            const op = parent.querySelector('.varop-op').value;
            const val = parent.querySelector('.varop-val').value;
            
            if (!val && key !== 'custom') return alert("請輸入數值！");
            
            const inputStr = `${key} ${op}${val}`;
            
            // 🌟 核心修改：同時支援選項區 (.opt-varops) 與主節點區 (#mainVarOps)
            const mainInput = parent.querySelector('.opt-varops') || parent.querySelector('#mainVarOps');
            
            if (mainInput.value.trim() === '') {
                mainInput.value = inputStr;
            } else {
                mainInput.value += `, ${inputStr}`;
            }
            
            parent.querySelector('.varop-val').value = ''; // 清空數值方便下次輸入
        }

        function addOption(initialData = null) {
            optionCount++;
            const div = document.createElement('div');
            div.className = 'option-block';
            div.id = `opt-${optionCount}`;
            div.innerHTML = `
                <button class="btn btn-remove" onclick="this.parentElement.remove()">X</button>
                <h3>選項 ${optionCount}</h3>
                <div class="form-group"><label>按鈕文字</label>
                    <input type="text" class="opt-label-zh lang-input" placeholder="中文">
                    <input type="text" class="opt-label-jp lang-input" placeholder="日文">
                    <input type="text" class="opt-label-kr lang-input" placeholder="韓文">
                </div>
                <div class="row form-group">
                    <div class="col"><label>需求標籤 (tags)</label><input type="text" class="opt-cond-tags" placeholder="逗號分隔"></div>
                    <div class="col"><label>排除標籤 (noTag)</label><input type="text" class="opt-cond-notags" placeholder="不可持有"></div>
                </div>
                <div class="row form-group">
                    <div class="col"><label>檢定屬性</label><select class="opt-stat"><option value="">無</option><option value="STR">STR</option><option value="INT">INT</option><option value="AGI">AGI</option><option value="LCK">LCK</option></select></div>
                    <div class="col"><label>難度</label><input type="number" class="opt-val"></div>
                </div>
                
                <div class="form-group">
                    <label>狀態增減 (VarOps) <span class="hint-text">可使用組合器快速加入，或在下方直接手寫</span></label>
                    <div class="builder-row">
                        <select class="varop-key" style="flex: 2;">
                            <optgroup class="dynamic-chars" label="當前出場角色 (自動抓取)"></optgroup>
                            
                            <optgroup label="❤️ 情感軸 (aff_)">
                                <option value="aff_main">主要對象 (aff_main)</option>
                                <option value="aff_partner">同伴/搭檔 (aff_partner)</option>
                                <option value="aff_guide_npc">引導/NPC (aff_guide_npc)</option>
                                <option value="aff_threat">明確威脅 (aff_threat)</option>
                            </optgroup>

                            <optgroup label="🤝 信任軸 (trust_)">
                                <option value="trust_main">主要對象 (trust_main)</option>
                                <option value="trust_partner">同伴/搭檔 (trust_partner)</option>
                                <option value="trust_guide_npc">引導/NPC (trust_guide_npc)</option>
                                <option value="trust_threat">明確威脅 (trust_threat)</option>
                            </optgroup>

                            <optgroup label="👁️ 警戒軸 (susp_)">
                                <option value="susp_main">主要對象 (susp_main)</option>
                                <option value="susp_partner">同伴/搭檔 (susp_partner)</option>
                                <option value="susp_guide_npc">引導/NPC (susp_guide_npc)</option>
                                <option value="susp_threat">明確威脅 (susp_threat)</option>
                            </optgroup>

                            <optgroup label="📦 基礎資源">
                                <option value="hp">生命值 (hp)</option>
                                <option value="energy">精力 (energy)</option>
                                <option value="gold">金幣 (gold)</option>
                                <option value="exp">經驗值 (exp)</option>
                                <option value="skill_points">技能點 (skill_points)</option>
                            </optgroup>

                            <optgroup label="⏳ 時間與進度">
                                <option value="time_left">剩餘時間 (time_left)</option>
                                <option value="progress">破解進度 (progress)</option>
                            </optgroup>

                            <optgroup label="⚠️ 精神與局勢威脅">
                                <option value="sanity">理智值 (sanity)</option>
                                <option value="stress">心理壓力 (stress)</option>
                                <option value="tension">局勢緊張度 (tension)</option>
                                <option value="curse_val">作祟值 (curse_val)</option>
                                <option value="alert_level">警報等級 (alert_level)</option>

        function runLinter(highlightId = null) {
            let code = document.getElementById('scanInput').value;
            if(!code.trim()) return alert("請貼上代碼！");

            // ==========================================
            // 🌟 模組一：自動替換舊變數與舊佔位符（字串層）
            // ==========================================
            const legacyMap = {
                'lover': 'main', 'suspect_A': 'main', 'detective': 'partner',
                'suspect_B': 'guide_npc', 'victim': 'hidden', 'mentor': 'guide_npc',
                'rival': 'partner', 'trainee': 'main', 'hero': 'main',
                'survivor': 'main', 'monster': 'threat', 'boss': 'threat',
                'free_time': 'time_left', 'search_count': 'time_left'
            };

            let autoFixLogs = [];
            let originalCode = code;

            const axisPrefixes = ['aff_', 'trust_', 'susp_'];
            axisPrefixes.forEach(prefix => {
                for(let oldKey in legacyMap) {
                    const regex = new RegExp(prefix + oldKey, 'g');
                    if(regex.test(code)) {
                        code = code.replace(regex, prefix + legacyMap[oldKey]);
                        autoFixLogs.push(`變數：<code>${prefix}${oldKey}</code> ➔ <code>${prefix}${legacyMap[oldKey]}</code>`);
                    }
                }
            });
            for(let oldKey in legacyMap) {
                const regex = new RegExp(`\\{${oldKey}\\}`, 'g');
                if(regex.test(code)) {
                    code = code.replace(regex, `{${legacyMap[oldKey]}}`);
                    autoFixLogs.push(`對話佔位：<code>{${oldKey}}</code> ➔ <code>{${legacyMap[oldKey]}}</code>`);
                }
            }

            // ==========================================
            // 🌟 模組一點五：剝離所有 // 行註解，保存位置，修復後還原
            // 策略：把每一行 // 後面的內容替換成佔位符，修復完再還原
            // ==========================================
            const commentPlaceholders = [];
            code = code.replace(/\/\/[^\n]*/g, (match) => {
                const idx = commentPlaceholders.length;
                commentPlaceholders.push(match);
                return `/*COMMENT_${idx}*/`;
            });

            // ==========================================
// 🌟 模組二：解析物件、結構修復、寫回 (括號計數升級版)
// ==========================================
let extractedNodes = [];
const keywordRegex = /(register|DB\.templates\.push)\s*\(/g;
let match;

while ((match = keywordRegex.exec(code)) !== null) {
    let startIndex = match.index; // 整個區塊的起點
    let contentStart = keywordRegex.lastIndex; // 左括號 '(' 的下一個字元
    let openBrackets = 1; // 第一個左括號
    let currentIndex = contentStart;

    // 尋找匹配的右括號
    while (currentIndex < code.length && openBrackets > 0) {
        if (code[currentIndex] === '(') openBrackets++;
        if (code[currentIndex] === ')') openBrackets--;
        currentIndex++;
    }

    // 如果括號成功閉合
    if (openBrackets === 0) {
        // 向後尋找是否帶有分號 (將 register(...); 的分號也包進去，方便完整替換)
        let matchEndIndex = currentIndex;
        while (matchEndIndex < code.length && /\s/.test(code[matchEndIndex])) {
            matchEndIndex++;
        }
        if (code[matchEndIndex] === ';') {
            matchEndIndex++;
        }

        let fullMatch = code.substring(startIndex, matchEndIndex); // 包含 register(...);
        let innerContent = code.substring(contentStart, currentIndex - 1); // 只抽取出 ... 的部分

        try {
            // 剝離佔位符以進行 eval 轉換
            const cleanInner = innerContent.replace(/\/\*COMMENT_\d+\*\//g, '');
            const nodeData = eval("(" + cleanInner + ")");
            extractedNodes.push({
                mode: match[1].includes('push') ? 'random' : 'fixed',
                data: nodeData,
                rawMatch: fullMatch,
                rawInner: innerContent
            });
        } catch(e) {
            console.warn("節點解析失敗，跳過此段:", e);
            // 你也可以在這裡 push 一個錯誤到 UI 上
        }
        
        // 更新 Regex 的搜尋指標，避免無窮迴圈
        keywordRegex.lastIndex = matchEndIndex;
    }
}

                let statusClass = '';
                if (id === highlightId) statusClass = 'highlighted';
                else if (logicErrors.length > 0 || errors.length > 0) statusClass = 'error';
                else if (hasAutoFixed) statusClass = 'highlighted';
                else if (warnings.length > 0) statusClass = 'warning';

                let logicHtml = logicErrors.map(e => `<p class="logic-msg">${e}</p>`).join('');
                let errHtml = errors.map(e => `<p class="err-msg">${e}</p>`).join('');
                let warnHtml = warnings.map(w => `<p class="warn-msg">${w}</p>`).join('');

                resultsHTML += `
                    <div class="scan-item ${statusClass}" id="scan-node-${id}">
                        <div class="scan-details">
                            <div class="scan-id">${id} <span style="font-size:0.75em;color:#888;">(${mode})</span></div>
                            ${logicHtml}
                            ${errHtml}
                            ${warnHtml}
                            ${optHTML}
                        </div>
                        <div><button class="btn-edit" onclick="loadNodeData('${id}')">✏️ 載入編輯</button></div>
                    </div>`;
            });

            // ==========================================
            // 🌟 模組三：還原佔位符，寫回文字框
            // ==========================================
            code = code.replace(/\/\*COMMENT_(\d+)\*\//g, (_, i) => commentPlaceholders[parseInt(i)]);

            autoFixLogs = [...new Set(autoFixLogs)];
            if (code !== originalCode) {
                const ta = document.getElementById('scanInput');
                ta.value = code;
                ta.style.backgroundColor = '#4e4e2a';
                ta.style.transition = 'background-color 0.5s';
                setTimeout(() => ta.style.backgroundColor = '#3c3c3c', 800);
            }

            let autoFixPanel = "";
            if (autoFixLogs.length > 0) {
                let logsHtml = autoFixLogs.map(log => `<li>${log}</li>`).join('');
                autoFixPanel = `
                <div style="background: #2b3a42; border-left: 4px solid #4ec9b0; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
                    <h4 style="margin-top:0; color: #4ec9b0;">✨ 已為您自動升級舊版劇本參數：</h4>
                    <ul style="color: #d4d4d4; font-size: 0.9em; margin-bottom: 0;">${logsHtml}</ul>
                    <p style="font-size: 0.8em; color: #888; margin-top: 10px; margin-bottom: 0;">
                        (已自動更新上方代碼框，您可以直接點擊下方節點進行編輯檢查)
                    </p>
                </div>`;
            }

            document.getElementById('scanResults').innerHTML = autoFixPanel + (resultsHTML || "<p>找不到節點</p>");

            if (highlightId) {
                setTimeout(() => {
                    const el = document.getElementById(`scan-node-${highlightId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        } // runLinter 函式結束
		
        function syncParsedDBToScanner() {
            // 🌟 只替換當前正在編輯的節點，保留其他文字與註解
            const nodeId = currentEditingNodeId;
            if (!nodeId || !parsedNodesDB[nodeId]) {
                // 沒有正在編輯的節點時才整個重寫（初次使用）
                let fullCode = "";
                for (let id in parsedNodesDB) {
                    const item = parsedNodesDB[id];
                    const jsonStr = JSON.stringify(item.data, null, 4);
                    fullCode += (item.mode === 'random' ? `    DB.templates.push(\n` : `    register(\n`) + 
                                `${jsonStr.replace(/^/gm, '        ')}\n    );\n\n`;
                }
                document.getElementById('scanInput').value = fullCode.trim();
                triggerAllResize();
                return;
            }

            const item = parsedNodesDB[nodeId];
            const jsonStr = JSON.stringify(item.data, null, 4);
            const newBlock = (item.mode === 'random' ? `    DB.templates.push(\n` : `    register(\n`) + 
                             `${jsonStr.replace(/^/gm, '        ')}\n    );`;

            const ta = document.getElementById('scanInput');
            const currentText = ta.value;

            // 嘗試在現有文字中找到這個節點的代碼區塊並替換
            // 用 "id": "nodeId" 當錨點，往前找 register( 或 DB.templates.push(，往後找對應的 );
            const anchorPattern = new RegExp(
                `((?:DB\\.templates\\.push|register)\\s*\\(\\s*\\n[\\s\\S]*?"id"\\s*:\\s*"${nodeId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}"[\\s\\S]*?\\n\\s*\\);)`,
                'g'
            );

            if (anchorPattern.test(currentText)) {
                ta.value = currentText.replace(anchorPattern, newBlock);
            } else {
                // 節點不在文字框中，附加到末尾（保留原有文字）
                const trimmed = currentText.trim();
                ta.value = trimmed ? trimmed + "\n\n" + newBlock : newBlock;
            }

            triggerAllResize();
        }

        function loadNodeData(id) {
            const item = parsedNodesDB[id]; 
            if(!item) return;
            
            currentEditingNodeId = id; 
            const node = item.data;
            
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('nodeId').value = node.id || '';
            document.getElementById('scriptMode').value = item.mode;
            document.getElementById('reqTags').value = (node.reqTags || []).join(', ');
            document.getElementById('nodeType').value = node.isHub ? 'hub' : 'linear';
            toggleHubMode();

            const dialogToStr = (arr, lang) => (arr||[]).map(d => d.text?.[lang] || '').filter(Boolean).join('\n');
            
            document.getElementById('mainZh').value = dialogToStr(node.dialogue, 'zh') || node.text?.zh || "";
            document.getElementById('mainJp').value = dialogToStr(node.dialogue, 'jp') || node.text?.jp || "";
            document.getElementById('mainKr').value = dialogToStr(node.dialogue, 'kr') || node.text?.kr || "";

            if(node.isHub) {
                document.getElementById('briefZh').value = dialogToStr(node.briefDialogue, 'zh') || node.briefText?.zh || "";
                document.getElementById('briefJp').value = dialogToStr(node.briefDialogue, 'jp') || node.briefText?.jp || "";
                document.getElementById('briefKr').value = dialogToStr(node.briefDialogue, 'kr') || node.briefText?.kr || "";
            }
			const mOnEnter = node.onEnter || node.rewards || node.onFirstEnter || {};
            document.getElementById('mainTags').value = (mOnEnter.tags || []).join(', ');
            
            let mVarOpsStr = [];
            if(mOnEnter.varOps) {
                mVarOpsStr = mOnEnter.varOps.map(v => {
                    let op = (v.op && v.op.toLowerCase() === 'set') ? '=' : v.op;
                    return `${v.key} ${op}${v.val}`;
                });
            }
            // 相容舊版直接寫 gold/exp 的寫法
            if(mOnEnter.gold) mVarOpsStr.push(`gold +${mOnEnter.gold}`);
            if(mOnEnter.exp) mVarOpsStr.push(`exp +${mOnEnter.exp}`);
            
            document.getElementById('mainVarOps').value = mVarOpsStr.join(', ');
            if(node.options) node.options.forEach(o => addOption(o));

            switchTab('editor');
            triggerAllResize();
            
            // 🌟 自動滾動到編輯器頂部
            setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 100);
        }

        function generateAndSync() {
            const newBlock = generateJSONCore(); // 1. 先更新記憶體中的 parsedNodesDB
            const nodeId = document.getElementById('nodeId').value || 'new_node';

            // 2. 將新代碼寫入 scanInput（保留其他節點與手寫註解）
            const ta = document.getElementById('scanInput');
            const currentText = ta.value;
            const anchorPattern = new RegExp(
                `((?:DB\.templates\.push|register)\s*\(\s*\n[\s\S]*?"id"\s*:\s*"${nodeId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}"[\s\S]*?\n\s*\);)`,
                'g'
            );
            if (anchorPattern.test(currentText)) {
                ta.value = currentText.replace(anchorPattern, newBlock);
            } else {
                const trimmed = currentText.trim();
                ta.value = trimmed ? trimmed + "\n\n" + newBlock : newBlock;
            }
            triggerAllResize();

            switchTab('scanner');
            runLinter(nodeId); 
            
            // 🌟 3. 自動滾動到掃描區頂部
            setTimeout(() => {
                document.getElementById('scanInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function generateJSONCore() {
            const nodeId = document.getElementById('nodeId').value || 'new_node';
            const isHub = document.getElementById('nodeType').value === 'hub';
            const scriptMode = document.getElementById('scriptMode').value;
            
            const getLines = (id) => document.getElementById(id).value.split('\n').filter(l=>l.trim());
            const buildDiag = (prefix) => {
                const zh = getLines(prefix+'Zh'), jp = getLines(prefix+'Jp'), kr = getLines(prefix+'Kr');
                if(!zh.length) return null;
                return zh.map((l, i) => {
                    let textObj = { zh: l };
                    if(jp[i]) textObj.jp = jp[i];
                    if(kr[i]) textObj.kr = kr[i];
                    return { text: textObj };
                });
            };

            // 🌟 核心升級：無損繼承底板
            // 我們把原始代碼中的物件深拷貝過來，確保那些沒做 UI 輸入框的進階屬性不會被洗掉
            let obj = { id: nodeId };
            if (currentEditingNodeId && parsedNodesDB[currentEditingNodeId]) {
                obj = JSON.parse(JSON.stringify(parsedNodesDB[currentEditingNodeId].data));
                // 清空這幾個會由 UI 重新建構的陣列與字串
                delete obj.dialogue;
                delete obj.briefDialogue;
                delete obj.options;
				if (obj.onEnter) {
                    delete obj.onEnter.tags;
                    delete obj.onEnter.varOps;
                    delete obj.onEnter.gold;
                    delete obj.onEnter.exp;
                    delete obj.onEnter.energy;
                }
                delete obj.rewards; // rewards 統一升級為 onEnter，所以直接刪除
            } else {
                obj = { id: nodeId };
            }

            if (isHub) obj.isHub = true;
            if (scriptMode === 'random') {
                obj.type = 'middle';
                const rTags = document.getElementById('reqTags').value;
                if(rTags) obj.reqTags = rTags.split(',').map(s=>s.trim()).filter(Boolean);
            }

            // ▼▼▼ 新增：儲存主節點進入獎勵 ▼▼▼
            const mTags = document.getElementById('mainTags').value;
            const mVarOps = document.getElementById('mainVarOps').value;
            if (mTags || mVarOps) {
                obj.onEnter = obj.onEnter || {}; 
                if (mTags) obj.onEnter.tags = mTags.split(',').map(s=>s.trim()).filter(Boolean);
                if (mVarOps) {
                    obj.onEnter.varOps = mVarOps.split(',').map(s => {
                        const m = s.trim().match(/^(\w+)\s*([+\-=]|set)\s*(\-?\d+)$/i);
						if (m) {
							// 統一將 set 轉換為 =，確保輸出的 JSON 格式統一
							let op = (m[2].toLowerCase() === 'set') ? '=' : m[2];
							return { key: m[1], op: op, val: parseInt(m[3]) };
						}
						return null;
                    }).filter(Boolean);
                }
            }

            obj.dialogue = buildDiag('main') || [{ text: { zh: "（請填寫對話）" } }];
            if (isHub) {
                const brief = buildDiag('brief');
                if (brief) obj.briefDialogue = brief;
            }

            obj.options = [];
            document.querySelectorAll('.option-block').forEach(block => {
                const getInp = (cls) => block.querySelector('.'+cls).value;
                let opt = { label: { zh: getInp('opt-label-zh') || "繼續" } };
                if(getInp('opt-label-jp')) opt.label.jp = getInp('opt-label-jp');
                if(getInp('opt-label-kr')) opt.label.kr = getInp('opt-label-kr');

                const condTags = getInp('opt-cond-tags'), condNoTags = getInp('opt-cond-notags');
                if(condTags || condNoTags) {
                    opt.condition = {};
                    if(condTags) opt.condition.tags = condTags.split(',').map(s=>s.trim()).filter(Boolean);
                    if(condNoTags) opt.condition.noTag = condNoTags.trim();
                }

                const stat = getInp('opt-stat'), val = parseInt(getInp('opt-val'));
                if (stat && !isNaN(val)) opt.check = { stat: stat, val: val };

                let rew = {};
                if(getInp('opt-tags')) rew.tags = getInp('opt-tags').split(',').map(s=>s.trim()).filter(Boolean);
                if(getInp('opt-rm-tags')) rew.removeTags = getInp('opt-rm-tags').split(',').map(s=>s.trim()).filter(Boolean);
                
                const varOpsStr = getInp('opt-varops');
                if(varOpsStr) {
                    rew.varOps = varOpsStr.split(',').map(s => {
                        const m = s.trim().match(/^(\w+)\s*([+\-=]|set)\s*(\-?\d+)$/i);
						if (m) {
							// 統一將 set 轉換為 =，確保輸出的 JSON 格式統一
							let op = (m[2].toLowerCase() === 'set') ? '=' : m[2];
							return { key: m[1], op: op, val: parseInt(m[3]) };
						}
						return null;
                    }).filter(Boolean);
                }

                const nId = getInp('opt-next-id'), resZh = getInp('opt-res-zh');
                
                if (nId || resZh) {
                    opt.action = "node_next";
                    if(nId) opt.nextSceneId = nId;
                    if(resZh) {
                        let nsText = { zh: resZh };
                        if(getInp('opt-res-jp')) nsText.jp = getInp('opt-res-jp');
                        if(getInp('opt-res-kr')) nsText.kr = getInp('opt-res-kr');
                        opt.nextScene = { dialogue: [{ text: nsText }] };
                        if(Object.keys(rew).length > 0) opt.nextScene.onEnter = rew; 
                    } else if (Object.keys(rew).length > 0) {
                        opt.rewards = rew; 
                    }
                } else {
                    opt.action = isHub ? "map_return_hub" : "advance_chain";
                    if (Object.keys(rew).length > 0) opt.rewards = rew; 
                }

                const failZh = getInp('opt-fail-zh');
                if (failZh) opt.onFail = { dialogue: [{ text: { zh: failZh } }] };

                obj.options.push(opt);
            });

            const jsonStr = JSON.stringify(obj, null, 4);
            const wrapper = (scriptMode === 'random' ? `    DB.templates.push(\n` : `    register(\n`) + 
                            `${jsonStr.replace(/^/gm, '        ')}\n    );`;
            
            document.getElementById('outputCode').textContent = wrapper;

            parsedNodesDB[nodeId] = { mode: scriptMode, data: obj };
            if (currentEditingNodeId && currentEditingNodeId !== nodeId) {
                delete parsedNodesDB[currentEditingNodeId]; 
            }
            currentEditingNodeId = nodeId;

            return wrapper;
        }

        function addToStash() { 
            stashContent += generateJSONCore() + "\n\n"; 
            localStorage.setItem('story_generator_stash', stashContent); 
            const el = document.getElementById('stashCode');
            el.textContent = stashContent; 
            
            // 🌟 自動滾動到暫存區底部
            el.scrollIntoView({ behavior: 'smooth', block: 'end' }); 
            alert("已加入備份暫存區！");
        }
        function clearStash() { 
            if(confirm("確定清空備份？")) { 
                stashContent = ""; 
                localStorage.setItem('story_generator_stash', ""); 
                document.getElementById('stashCode').textContent = "// 備份區已清空"; 
            } 
        }
        function downloadJS() { 
            if(!stashContent) return alert("暫存區為空！");
            const blob = new Blob([stashContent], { type: 'text/javascript' }); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = 'story_export.js'; 
            a.click(); 
        }
		function exportStoryText(langTarget) {
            // 確保是最新的掃描結果
            if (Object.keys(parsedNodesDB).length === 0) {
                runLinter(); // 若沒掃描過，嘗試自動掃描當前文字框
            }
            if (Object.keys(parsedNodesDB).length === 0) {
                return alert("目前沒有解析到任何節點！請先在掃描區貼上代碼。");
            }
            
            let output = "========================================\n";
            output += "🎮 遊戲劇本純文本匯出\n";
            output += "========================================\n";
            
            for (let id in parsedNodesDB) {
                const node = parsedNodesDB[id].data;
                output += `\n【節點 ID: ${id}】\n`;
                
                // 輔助函式：根據選擇的語言抓取文字
                const getStr = (textObj) => {
                    if(!textObj) return "";
                    if(langTarget === 'all') {
                        let res = [];
                        if(textObj.zh) res.push(`(中) ${textObj.zh}`);
                        if(textObj.jp) res.push(`(日) ${textObj.jp}`);
                        if(textObj.kr) res.push(`(韓) ${textObj.kr}`);
                        return res.join('\n');
                    }
                    return textObj[langTarget] || "";
                };

                const getDiag = (arr) => (arr||[]).map(d => getStr(d.text)).filter(Boolean).join('\n');

                output += `📖 [主線]\n${getDiag(node.dialogue) || getStr(node.text)}\n\n`;
                
                if (node.options && node.options.length > 0) {
                    node.options.forEach((opt, idx) => {
                        output += `  ▶ [選項 ${idx+1}] ${getStr(opt.label)}\n`;
                        if (opt.nextScene) {
                            const successText = getDiag(opt.nextScene.dialogue) || getStr(opt.nextScene.text);
                            if (successText) output += `    ✔ (成功/後續)\n      ${successText.replace(/\n/g, '\n      ')}\n`;
                        }
                        if (opt.onFail) {
                            const failText = getDiag(opt.onFail.dialogue) || getStr(opt.onFail.text);
                            if (failText) output += `    ❌ (失敗)\n      ${failText.replace(/\n/g, '\n      ')}\n`;
                        }
                    });
                }
                output += `----------------------------------------\n`;
            }

            // 產生 txt 下載
            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Story_Dialogue_${langTarget}.txt`;
            a.click();
        }

        window.onload = () => { 
            if(!document.querySelector('.option-block')) addOption(); 
            triggerAllResize();
        };
    </script>
</body>
